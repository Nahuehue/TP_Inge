<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busqueda de Talleres - Visitante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100%; min-height: 500px; width: 100%; }
        .lista-scroll { max-height: 420px; overflow-y: auto; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Portal Cultural UNGS - Buscador de Talleres</span>
            <a href="inscripcion.html" class="btn btn-outline-light">Ir a Inscripción (Colaboradores)</a>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row style-contenedor" style="min-height: 550px;">
            <div class="col-md-4 d-flex flex-column gap-3">
                <div class="card shadow-sm">
                    <div class="card-header bg-white font-weight-bold">
                        <strong>Filtros de Búsqueda Avanzada (RF05)</strong>
                    </div>
                    <div class="card-body row g-2">
                        <div class="col-12">
                            <input type="text" id="buscar-texto" class="form-control" placeholder="Buscar por nombre o rubro...">
                        </div>
                        <div class="col-6">
                            <input type="text" id="buscar-localidad" class="form-control" placeholder="Localidad (ej: San Miguel)">
                        </div>
                        <div class="col-6">
                            <input type="text" id="buscar-dias" class="form-control" placeholder="Día (ej: Lunes)">
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm flex-grow-1">
                    <div class="card-header bg-white"><strong>Talleres Disponibles</strong></div>
                    <div id="lista-talleres" class="list-group list-group-flush lista-scroll">
                        </div>
                </div>
            </div>

            <div class="col-md-8">
                <div id="map" class="shadow-sm border rounded"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/data.js"></script>
    <script src="js/busqueda.js"></script>
</body>
</html>
