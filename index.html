<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Cultural UNGS - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

    <div class="container text-center">
        <h1 class="display-4 fw-bold text-primary mb-3">Portal de Talleres Culturales</h1>
        <p class="lead text-secondary mb-5">Prueba de Concepto - Seleccione su perfil de acceso</p>

        <div class="row justify-content-center gap-4">
            <div class="col-md-4">
                <div class="card shadow-sm h-100 border-primary">
                    <div class="card-body py-5">
                        <h3 class="card-title text-primary">Colaboradores</h3>
                        <p class="card-text text-muted mb-4">Registro de nuevos miembros y alta de talleres culturales (RF01).</p>
                        <a href="inscripcion.html" class="btn btn-primary btn-lg w-100">Ingresar como Colaborador</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm h-100 border-success">
                    <div class="card-body py-5">
                        <h3 class="card-title text-success">Visitantes</h3>
                        <p class="card-text text-muted mb-4">Búsqueda interactiva de talleres y visualización en mapa (RF08).</p>
                        <a href="busqueda.html" class="btn btn-success btn-lg w-100">Ingresar como Visitante</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
